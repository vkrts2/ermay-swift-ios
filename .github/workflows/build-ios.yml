name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/g' ErmayMobil.xcodeproj/project.pbxproj || true

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project ErmayMobil.xcodeproj -scheme ErmayMobil

      - name: Archive iOS App
        run: |
          set -o pipefail
          xcodebuild -project ErmayMobil.xcodeproj \
            -scheme ErmayMobil \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ErmayMobil.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee xcodebuild.log || (echo "=== XCODEBUILD FAILED - COMPILER ERRORS ===" && grep -E "error:" xcodebuild.log -B 2 -A 4 | head -n 100 && exit 1)

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: xcodebuild.log

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ErmayMobil.xcarchive/Products/Applications/ErmayMobil.app build/Payload/
          # Copy app icons directly into .app bundle root for guaranteed Springboard icon display
          cp Sources/ErmayMobil/Resources/Assets.xcassets/AppIcon.appiconset/*.png build/Payload/ErmayMobil.app/ || true
          cd build
          zip -qr ErmayMobil.ipa Payload
          cp ErmayMobil.ipa VK.ipa
          ls -lh ErmayMobil.ipa VK.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ErmayMobil-iOS-IPA
          path: |
            build/ErmayMobil.ipa
            build/VK.ipa
          retention-days: 14

